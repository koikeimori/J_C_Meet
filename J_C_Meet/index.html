<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跨國視訊聊天室</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #mainVideo {
      width: 80%;
      height: 60vh;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }
    #localVideo {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 180px;
      height: 130px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid #00ff88;
    }
    #joinSection {
      margin-top: 20px;
    }
    #controls {
      display: none;
      gap: 10px;
      margin: 20px;
    }
    button {
      background: #00ff88;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #00cc6a;
    }
    #status, #error {
      margin: 10px;
      font-size: 14px;
    }
    #error { color: #ff5555; }
  </style>
</head>

<body>
  <h2>🌍 跨國即時視訊聊天室</h2>

  <video id="mainVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>

  <div id="joinSection">
    <input id="channel" placeholder="輸入頻道名稱" value="testroom" />
    <button id="joinBtn" onclick="joinChannel()">加入頻道</button>
  </div>

  <div id="controls">
    <button onclick="toggleMic()">🎤 麥克風</button>
    <button onclick="toggleVideo()">📷 攝影機</button>
    <button onclick="leaveChannel()">🚪 離開</button>
  </div>

  <div id="status"></div>
  <div id="error"></div>

  <script>
    const APP_ID = "4c924c6a53374305abf066c12bb2b38c";  // 🔹請填入你的 Agora App ID
    const TOKEN = "007eJxTYNC7WCu8ySvrRsCWZzpfbrdHCoi+n/S6eh6XS/meC9rzMzUVGEySLY1Mks0STY2NzU2MDUwTk9IMzMySDY2SkoySjC2SPRI/ZzQEMjL8uNvByMgAgSA+C0NuamoJAwMAbuQgYg==";                  // 🔹若啟用 Token 驗證請填入
    const UID = null;

    let client, localAudioTrack, localVideoTrack;
    let remoteUsers = {};
    let isMicMuted = false;
    let isVideoOff = false;
    let currentMainUid = null;

    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const joinBtn = document.getElementById('joinBtn');
    const joinSection = document.getElementById('joinSection');

    // 初始化檢查
    window.addEventListener('load', () => {
      if (typeof AgoraRTC === 'undefined') {
        errorEl.textContent = '❌ SDK 載入失敗，請檢查網路或 CDN URL。';
        joinBtn.disabled = true;
      } else {
        statusEl.textContent = '✅ SDK 載入完成，準備加入...';
      }
    });

    async function joinChannel() {
      const channel = document.getElementById('channel').value.trim();
      if (!channel) {
        alert('請輸入頻道名稱');
        return;
      }

      statusEl.textContent = '加入頻道中...';
      errorEl.textContent = '';
      joinBtn.disabled = true;

      try {
        client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });

        // 🔸註冊事件：監聽遠端使用者
        client.on('user-published', async (user, mediaType) => {
          console.log('🟢 user-published', user.uid, mediaType);
          await client.subscribe(user, mediaType);

          if (mediaType === 'video') {
            const remoteVideoTrack = user.videoTrack;
            remoteVideoTrack.play('mainVideo', { mirror: false, fit: 'cover' });
            currentMainUid = user.uid;
            remoteUsers[user.uid] = user;
          }

          if (mediaType === 'audio') {
            user.audioTrack && user.audioTrack.play();
          }
        });

        client.on('user-unpublished', (user) => {
          console.log('🔴 user-unpublished', user.uid);
          if (user.uid === currentMainUid) {
            document.getElementById('mainVideo').srcObject = null;
          }
          delete remoteUsers[user.uid];
        });

        // 加入 Agora 頻道
        await client.join(APP_ID, channel, TOKEN, UID);
        console.log('✅ 已加入頻道：', channel);
        statusEl.textContent = '獲取媒體設備...';

        // 建立並播放本地視頻
        [localAudioTrack, localVideoTrack] = await AgoraRTC.createMicrophoneAndCameraTracks();
        console.log('🎥 本地媒體取得成功');

        await localVideoTrack.play('localVideo', { mirror: true, fit: 'contain' });
        console.log('📺 本地預覽啟動');

        // 發佈到 Agora 網絡
        await client.publish([localAudioTrack, localVideoTrack]);
        console.log('📡 已發佈本地軌道');
        statusEl.textContent = '連線成功！';

        joinSection.style.display = 'none';
        document.getElementById('controls').style.display = 'flex';
      } catch (error) {
        console.error('❌ joinChannel 錯誤:', error);
        errorEl.textContent = '連線失敗：' + error.message;
        statusEl.textContent = '';
        joinBtn.disabled = false;
      }
    }

    async function leaveChannel() {
      if (localAudioTrack) localAudioTrack.close();
      if (localVideoTrack) localVideoTrack.close();

      await client.leave();
      statusEl.textContent = '已離開頻道';
      joinSection.style.display = 'block';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('mainVideo').srcObject = null;
      document.getElementById('localVideo').srcObject = null;
      joinBtn.disabled = false;
    }

    function toggleMic() {
      if (localAudioTrack) {
        isMicMuted = !isMicMuted;
        localAudioTrack.setEnabled(!isMicMuted);
        statusEl.textContent = isMicMuted ? '麥克風已關' : '麥克風開啟';
      }
    }

    function toggleVideo() {
      if (localVideoTrack) {
        isVideoOff = !isVideoOff;
        localVideoTrack.setEnabled(!isVideoOff);
        statusEl.textContent = isVideoOff ? '攝影機已關' : '攝影機開啟';
        if (!isVideoOff) localVideoTrack.play('localVideo', { mirror: true });
      }
    }
  </script>
</body>
</html>
